name: Claude Code Review

# Automatic AI code review on every pull request, from any author —
# replaces Gemini Code Assist (sunset). Runs on the GitHub Free plan.
# Auth: Claude Max subscription token (CLAUDE_CODE_OAUTH_TOKEN repo secret).
#
# Triggers:
#   - automatically when a PR is opened or marked ready for review
#   - on demand: comment "/claude review" on any PR (like "/gemini review")
#   - manually from the Actions tab (workflow_dispatch)

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Auto-run on non-draft, non-bot PRs; on-demand via "/claude review" comment
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       !endsWith(github.event.pull_request.user.login, '[bot]')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/claude review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: "claude-sonnet-5"
          direct_prompt: |
            Please review this pull request and provide feedback on:
            - For React components: Performance, accessibility, and best practices
            - For TypeScript files: Type safety and proper interface usage
            - For API endpoints: Security, input validation, and error handling
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            Be constructive and helpful in your feedback.
